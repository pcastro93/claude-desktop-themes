# Palette format: see ../../generator/PALETTE.md. Colors are "#rrggbb"; role picks may name a hue or ramp key instead.
name = "Solarized Dark"
mode = "dark"
# Neutral ramp, page background -> strongest contrast (dark to light in a dark theme)
bg = "#002b36"
bg_alt = "#073642"
border = "#0d3f4c"
border_strong = "#17505d"
fg_subtle = "#475f67"
fg_muted = "#586e75"
fg_secondary = "#839496"
fg = "#93a1a1"
fg_strong = "#eee8d5"
ink = "#fdf6e3"
on_color = "#fdf6e3"  # text on saturated fills (accent, danger, ...)
# Role picks
accent = "aqua"  # Solarized cyan
brand = "orange"
pro = "violet"
success = "green"
warning = "yellow"
danger = "red"
selection = "aqua"  # text selection: accent at 25%; omit to keep the system highlight
primary_button = "fg_strong"
primary_button_hover = "#cecfc3"
on_primary = "bg"
hues = { red = "#dc322f", orange = "#cb4b16", yellow = "#b58900", green = "#859900", aqua = "#2aa198", blue = "#268bd2", violet = "#6c71c4", magenta = "#d33682" }
# Code blocks: font size (bare numbers = px) and optional unitless line height
code_font_size = "13.5px"
# The Solarized code theme paints blocks the same as the page; use base02 so they stand out
# Sidebar: project (group) labels bigger than the session rows under them (bare numbers = px)
sidebar_group_font_size = "14px"
sidebar_row_font_size = "13px"
# Chat reply headings, one step apart and never below body size (the app makes h3-h6 all 1em); bare numbers = px
heading_sizes = { h1 = "1.75em", h2 = "1.6em", h3 = "1.4em", h4 = "1.25em", h5 = "1.15em", h6 = "1.05em" }
[override]
"--diffs-dark-bg" = "#073642"
"--diffs-light-bg" = "#073642"
