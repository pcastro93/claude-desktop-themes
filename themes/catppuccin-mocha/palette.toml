# Palette format: see ../../generator/PALETTE.md. Colors are "#rrggbb"; role picks may name a hue or ramp key instead.
# Catppuccin Mocha (https://catppuccin.com/palette). Neutrals: mantle/base/surface0/surface1/overlay0/overlay2/subtext1/text.
# Catppuccin has no aqua/violet of its own: aqua = sky, violet = mauve, magenta = pink; crust (#11111b) is used for shadows.
name = "Catppuccin Mocha"
mode = "dark"
# Neutral ramp, page background -> strongest contrast (dark to light in a dark theme)
bg = "#1e1e2e"            # base
bg_alt = "#181825"        # mantle
border = "#313244"        # surface0
border_strong = "#45475a" # surface1
fg_subtle = "#6c7086"     # overlay0
fg_muted = "#9399b2"      # overlay2
fg_secondary = "#bac2de"  # subtext1
fg = "#cdd6f4"            # text
fg_strong = "#e0e6fb"     # lighter than text (not official)
ink = "#ffffff"
on_color = "#1e1e2e"  # base: dark text on bright pastel fills
# Role picks
accent = "violet"         # mauve
brand = "orange"
pro = "#b4befe"           # lavender
success = "green"
warning = "yellow"
danger = "red"
primary_button = "violet"
primary_button_hover = "#dcc6fb"
on_primary = "#1e1e2e"
shadow = "#11111b"        # crust
hues = { red = "#f38ba8", orange = "#fab387", yellow = "#f9e2af", green = "#a6e3a1", aqua = "#89dceb", blue = "#89b4fa", violet = "#cba6f7", magenta = "#f5c2e7" }
# Code blocks: font size (bare numbers = px) and optional unitless line height
code_font_size = "13.5px"
# The Catppuccin code theme paints blocks the same as the page; use mantle so they stand out
[override]
"--diffs-dark-bg" = "#181825"
"--diffs-light-bg" = "#181825"
