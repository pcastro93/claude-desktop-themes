# Palette format: see ../../generator/PALETTE.md. Colors are "#rrggbb"; role picks may name a hue or ramp key instead.
# GitHub Dark (Primer, https://primer.style/foundations/color). Primer has no aqua or magenta in its base scale; they use teal and pink.
name = "GitHub Dark"
mode = "dark"
# Neutral ramp, page background -> strongest contrast (dark to light in a dark theme)
bg = "#0d1117"
bg_alt = "#161b22"
border = "#21262d"
border_strong = "#30363d"
fg_subtle = "#484f58"
fg_muted = "#7d8590"
fg_secondary = "#b1bac4"
fg = "#e6edf3"
fg_strong = "#f0f6fc"
ink = "#ffffff"
on_color = "#0d1117"  # dark text on bright fills
# Role picks
accent = "blue"
brand = "orange"
pro = "violet"
success = "green"
warning = "yellow"
danger = "red"
selection = "blue"  # text selection: accent at 25%; omit to keep the system highlight
primary_button = "blue"
primary_button_hover = "#79c0ff"
on_primary = "#0d1117"
shadow = "#010409"
hues = { red = "#ff7b72", orange = "#ffa657", yellow = "#e3b341", green = "#3fb950", aqua = "#39c5cf", blue = "#58a6ff", violet = "#bc8cff", magenta = "#f778ba" }
override = { "--diffs-dark-bg" = "#161b22", "--diffs-light-bg" = "#161b22" }
# Code blocks: font size (bare numbers = px) and optional unitless line height
code_font_size = "13.5px"
# Sidebar: project (group) labels bigger than the session rows under them (bare numbers = px)
sidebar_group_font_size = "14px"
sidebar_row_font_size = "13px"
sidebar_dot_size = "8px"  # unread/status dot next to sessions (app: 6px)
# Chat reply headings, one step apart and never below body size (the app makes h3-h6 all 1em); bare numbers = px
heading_sizes = { h1 = "1.75em", h2 = "1.6em", h3 = "1.4em", h4 = "1.25em", h5 = "1.15em", h6 = "1.05em" }
